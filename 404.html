<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | Pardo Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --negro: #0b0a0b; --blanco: #fff; --rojo: #c4161c; --rojo-oscuro: #9e1117; --texto-suave: #c9c6c9; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--negro) url("/assets/papel-negro.jpg") center / cover;
    color: var(--blanco); font-family: "Red Hat Display", system-ui, sans-serif;
    display: grid; place-items: center; text-align: center; padding: 24px 16px;
  }
  main { max-width: 560px; display: grid; gap: 20px; justify-items: center; }
  .logo { width: 72px; height: auto; }
  .codigo { font-size: clamp(96px, 24vw, 180px); font-weight: 900; line-height: .9; letter-spacing: -.03em; }
  .codigo span { color: transparent; -webkit-text-stroke: 2px var(--blanco); }
  h1 { font-size: clamp(22px, 4vw, 30px); font-weight: 900; }
  p { color: var(--texto-suave); font-size: 17px; line-height: 1.55; }
  .botones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
  a.boton { display: inline-block; padding: 14px 28px; border-radius: 999px; font-weight: 700; text-decoration: none; color: var(--blanco); border: 1.5px solid rgba(255,255,255,.6); }
  a.boton--rojo { background: var(--rojo); border-color: var(--rojo); }
  a.boton:hover { background: var(--rojo-oscuro); border-color: var(--rojo-oscuro); }
</style>
</head>
<body>
<main>
  <a href="/" aria-label="Pardo Studio, inicio"><img class="logo" src="/assets/logo.png" alt="Pardo Studio"></a>
  <div class="codigo" aria-hidden="true">4<span>0</span>4</div>
  <h1>Esta página no existe (o se mudó)</h1>
  <p>Puede que el link esté mal escrito o que ese contenido ya no esté. Pero nuestros trabajos siguen acá.</p>
  <div class="botones">
    <a class="boton boton--rojo" href="/#portfolio">Ver el portfolio</a>
    <a class="boton" href="/">Ir al inicio</a>
    <a class="boton" href="/#contacto">Escribinos</a>
  </div>
</main>
</body>
</html>
